# Produksi: menolak berjalan bila rahasia belum diisi, dan tidak mengisi data contoh.
# Isi COMPOSE_FILE=docker-compose.yml:infra/compose/production.yml di .env server, supaya setiap perintah
# docker compose (termasuk pemulihan dan cadangan) selalu memakai berkas ini. Lalu: docker compose up -d --build
services:
  db:
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di .env}
  web:
    # hanya Nginx di VM yang boleh mengakses; lihat infra/nginx/nginx-https.conf
    ports: !override ['127.0.0.1:8080:80']
  api:
    environment:
      DATABASE_URL: postgresql://mtpp:${DB_PASSWORD:?Isi DB_PASSWORD di .env}@db:5432/mtpp
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Isi JWT_SECRET di .env}
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:?Isi WEBHOOK_TOKEN di .env}
      SEED_DEMO: 'false'
