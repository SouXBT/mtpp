# Nginx pada VM (di luar Docker) sebagai terminasi HTTPS dengan sertifikat Let's Encrypt.
# Pasang: sudo apt install nginx certbot python3-certbot-nginx
#         sudo cp infra/nginx-https.conf /etc/nginx/sites-available/mtpp && sudo ln -s ../sites-available/mtpp /etc/nginx/sites-enabled/
#         sudo certbot --nginx -d distribusi.mtpp.co.id
server {
  listen 80;
  server_name distribusi.mtpp.co.id;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl http2;
  server_name distribusi.mtpp.co.id;
  ssl_certificate     /etc/letsencrypt/live/distribusi.mtpp.co.id/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/distribusi.mtpp.co.id/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000" always;
  client_max_body_size 25m;
  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
